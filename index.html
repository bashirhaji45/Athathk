<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أثاثك | أثاث يجعل بيتك أجمل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* ألوان دافئة من الخشب والكريم، مع أخضر هادئ للتوازن */
:root{--ink:#2B1D14;--wood:#5B3A29;--terra:#A84F2B;--sage:#4E6B50;--cream:#FAF5EC;--sand:#F0E5D2;--line:#E4D6BF;--mut:#6B5A4B}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;font:16px/1.75 Tajawal,sans-serif;color:var(--ink);background:var(--cream)}
:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
h2,h3{margin:0;color:var(--wood)}
/* رسومات الأثاث: a و b لونا القطعة، w خشب، l فاتح، s ظل */
.a{fill:var(--a)}.b{fill:var(--b)}.w{fill:#5B3A29}.l{fill:#F6EDDD}.s{fill:#2B1D141F}

header{background:#FAF5ECEE;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar,.row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.bar{min-height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:26px;color:var(--wood);text-decoration:none}
.logo svg{width:38px;height:28px}
nav ul{display:flex;gap:2px;list-style:none;margin:0;padding:0}
nav a{display:block;padding:10px 14px;min-height:44px;border-radius:10px;color:var(--mut);text-decoration:none;font-weight:500}
nav a:hover{background:var(--sand)}
nav a.on{color:var(--terra);background:var(--sand);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:12px;border:2px solid transparent;font:700 16px Tajawal,sans-serif;cursor:pointer;text-decoration:none;transition:.15s}
.btn:hover{transform:translateY(-1px)}
.pri{background:var(--terra);color:#fff}.pri:hover{background:#8C3F20}
.out{background:transparent;color:var(--wood);border-color:var(--wood)}.out:hover{background:var(--sand)}

.hero .wrap{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:center;padding-top:56px;padding-bottom:56px}
.tag{display:inline-block;background:var(--sand);color:var(--terra);font-weight:700;font-size:14px;padding:6px 14px;border-radius:20px;margin-bottom:14px}
.hero h1{font-size:46px;line-height:1.3;margin:0 0 14px;font-weight:800;color:var(--wood)}
.hero p{font-size:18px;color:var(--mut);margin:0 0 28px;max-width:480px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.scene{border-radius:28px;overflow:hidden;box-shadow:0 24px 50px #5B3A2930}
.scene svg{display:block;width:100%;height:auto}

section{padding:60px 0}
.sec-h{text-align:center;max-width:620px;margin:0 auto 28px}
.sec-h h2{font-size:32px;margin-bottom:8px}
.sec-h p{margin:0;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}
.chip{min-height:44px;padding:0 20px;border-radius:24px;border:1.5px solid var(--line);background:#fff;color:var(--wood);font:500 15px Tajawal,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--wood);color:#fff;border-color:var(--wood);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.card:hover{box-shadow:0 14px 32px #5B3A2926;transform:translateY(-3px)}
.pic{background:linear-gradient(#F6EDDD,#EBDCC4);padding:18px 18px 8px}
.pic svg{display:block;width:100%;height:170px}
.info{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1}
.info h3{font-size:19px;margin-bottom:4px}
.info p{margin:0 0 14px;color:var(--mut);font-size:15px;flex:1}
.info .btn{min-height:44px;font-size:15px}

.why{background:#fff}
.pt{display:flex;gap:14px}
.pt i{flex:none;width:44px;height:44px;border-radius:12px;background:var(--sand);color:var(--terra);display:grid;place-items:center;font-style:normal;font-weight:800}
.pt h3{font-size:18px;margin-bottom:4px}.pt p{margin:0;color:var(--mut);font-size:15px}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.step{background:var(--sage);color:#fff;border-radius:18px;padding:22px}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--cream);color:var(--sage);font-weight:800;margin-bottom:12px}
.step h3{color:#fff;font-size:17px;margin-bottom:4px}.step p{margin:0;color:#E3EEE3;font-size:14px}

.price{font-weight:800;color:var(--terra);font-size:19px;margin-bottom:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.cartbtn{position:relative}
.badge{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--terra);color:#fff;border-radius:12px;min-width:22px;height:22px;font:700 12px/22px Tajawal,sans-serif;text-align:center;padding:0 5px}
.cartbox{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px}
.item{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.item:first-child{padding-top:0}.item:last-child{border:0;padding-bottom:0}
.thumb{background:linear-gradient(#F6EDDD,#EBDCC4);border-radius:14px;padding:6px}
.thumb svg{display:block;width:100%;height:58px}
.item h3{font-size:16px}.item small{color:var(--mut)}
.qty{display:inline-flex;align-items:center;gap:6px;margin-top:6px}
.qty button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:700 18px Tajawal,sans-serif;cursor:pointer;color:var(--wood)}
.qty button:hover{background:var(--sand)}
.qty b{min-width:28px;text-align:center}
.lt{text-align:left;font-weight:800;color:var(--wood)}
.del{background:none;border:0;color:var(--mut);font:14px Tajawal,sans-serif;cursor:pointer;min-height:40px;text-decoration:underline}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.r2{display:flex;justify-content:space-between;gap:10px;padding:8px 0}
.tot{font-size:22px;font-weight:800;color:var(--wood);border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.hint{font-size:13px;color:var(--mut);margin:12px 0 0}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--wood);color:#fff;padding:12px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
#toast.on{opacity:1}
label{display:block;font-weight:700;font-size:15px;margin:10px 0 6px}
.in{width:100%;min-height:48px;border:1.5px solid #B9A88F;border-radius:12px;padding:0 12px;font:16px Tajawal,sans-serif;background:#fff;color:var(--ink)}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.bal{font-size:34px;font-weight:800;color:var(--terra);margin:2px 0 14px}
.payinfo{background:var(--sand);border-radius:14px;padding:12px 14px;margin:6px 0 14px;font-size:14px;display:grid;gap:8px}
.msg{padding:12px 14px;border-radius:12px;margin-top:12px;font-size:15px}
.msg.ok{background:#DDF3E4;color:#14602B}.msg.bad{background:#FDE7E4;color:#8C1D18}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;align-self:center}
.p-w{background:#FFF1D6;color:#7A4B00}.p-o{background:#DDF3E4;color:#14602B}.p-x{background:#FDE7E4;color:#8C1D18}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.sub{color:var(--mut)}
footer{background:var(--wood);color:#E8D9C4;padding:30px 0;font-size:14px}
footer .row{flex-wrap:wrap}
@media(max-width:820px){.hero .wrap,.cartbox,.wgrid{grid-template-columns:1fr}.hide-sm{display:none}.hero h1{font-size:34px}nav{display:none}.item{grid-template-columns:70px 1fr}.lt{grid-column:1/-1;text-align:right}}
</style>
</head>
